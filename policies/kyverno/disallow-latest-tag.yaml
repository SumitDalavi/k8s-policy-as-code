apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Image Tag
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/description: >
      Using the 'latest' image tag makes deployments non-deterministic.
      All containers must use a specific, pinned image tag.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Image tag ':latest' is not allowed. Pin to a specific digest or version tag."
        pattern:
          spec:
            containers:
              - image: "*:*"
                name: "?*"
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "The 'latest' tag is not permitted."
        deny:
          conditions:
            any:
              - key: "{{request.object.spec.containers[].image}}"
                operator: AnyIn
                value: ["*:latest"]
